site_name: Lei-Lab Knowledge Platform
site_url: https://leicaohmu.github.io/lei-lab-site
site_description: 课题组知识共享平台 · 交互式学习 · 开放协作
site_author: Lei-Lab Team
repo_url: https://github.com/leicaohmu/lei-lab-site
repo_name: leicaohmu/lei-lab-site

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.png
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow


plugins:
  - search:
      lang: zh
  - blog:
      blog_dir: papers
      post_date_format: full
      post_cover: blur
      post_cover_anchor: top
      post_url_format: "{date}/{slug}"
      archive: true
      archive_name: 按时间归档
      archive_date_format: yyyy
      archive_url_format: "archive/{date}"
      categories: true
      categories_name: 研究方向
      pagination: true
      pagination_per_page: 10
      blog_toc: true
  # - tags:
  #     tags_file: papers/tags.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 首页: index.md
  - 课程:
    - 概览: courses/index.md
    - 生物统计学:
      - 课程介绍: courses/biostat/index.md
      - 第1章 绪论: courses/biostat/01-intro.md
      - 第2章 概率论基础: courses/biostat/02-probability.md
      - 第3章 假设检验: courses/biostat/03-hypothesis.md
      - 第4章 回归分析: courses/biostat/04-regression.md
      - 第5章 生存分析: courses/biostat/05-survival.md
    - 线性代数:
      - 课程介绍: courses/linear-algebra/index.md
      - 第1章 向量与向量空间: courses/linear-algebra/01-vector.md
      - 第2章 矩阵运算: courses/linear-algebra/02-matrix.md
      - 第3章 行列式: courses/linear-algebra/03-determinant.md
      - 第4章 特征值与特征向量: courses/linear-algebra/04-eigenvalue.md
      - 第5章 奇异值分解: courses/linear-algebra/05-svd.md
  - 演示工具:
    - 概览: tools/index.md
  - 代码库:
    - 概览: api/index.md
    - histox:
      - 快速上手: api/histox/quickstart.md
      - Project: api/histox/project.md
      - ModelParams: api/histox/model_params.md
      - Heatmap: api/histox/heatmap.md
      - 工具函数: api/histox/utils.md
  - 文献抄读:
    - 概览: papers/index.md
    # - 标签索引: papers/tags.md
  - 博客:
    - 概览: blog/index.md
  - 课题组:
    - 认识我们: team/index.md
    - 发表文章: team/publications.md
    - 荣誉奖项: team/awards.md
  - ✏️ 管理: https://lei-lab-site.pages.dev/admin/


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/leicaohmu

extra_css:
  - assets/extra.css

